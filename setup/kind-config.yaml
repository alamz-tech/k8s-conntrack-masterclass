# setup/kind-config.yaml
# Two-node Kind cluster configuration for conntrack exhaustion & DNS amplification lab.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: conntrack-lab
networking:
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
nodes:
  # Control-plane node: hosts CoreDNS and Kubernetes API server
  - role: control-plane
    labels:
      tier: control-plane

  # Worker node: dedicated target where netfilter limits are constrained
  # and the payment-worker client pods execute
  - role: worker
    labels:
      triage: "target"

