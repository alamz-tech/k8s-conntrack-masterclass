# deploy/helm/checkout-service/values-patched.yaml
# SRE Remediation Pull Request (PR #1402: Fix conntrack table saturation & DNS search loops)
#
# Three-tier platform remediation:
#   1. Trailing dots on external/internal hostnames -> glibc skips all 4 search paths
#   2. Override ndots:5 down to ndots:2 + single-request-reopen
#   3. Resilient client mode with connection pooling and Full Jitter backoff

replicaCount: 6

config:
  mode: "resilient"
  # Trailing dots tell glibc this is an absolute FQDN
  postgresHost: "postgres.internal."
  postgresPort: 5432
  stripeHost: "api.stripe.com."
  stripePort: 443
  concurrency: 20
  requestTimeout: 1.0

# REMEDIATION: Custom dnsConfig overriding cluster defaults
dnsPolicy: ClusterFirst
dnsConfig:
  options:
    - name: ndots
      value: "2"
    - name: single-request-reopen
    - name: timeout
      value: "1"
    - name: attempts
      value: "2"
