# manifests/broken/01-mock-upstream.yaml
# Sets up the triage-lab namespace, mock database service, and registers 'db.internal' in CoreDNS.
---
apiVersion: v1
kind: Namespace
metadata:
  name: triage-lab
  labels:
    environment: triage-masterclass
---
# Mock Database Service with deterministic static ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: mock-db
  namespace: triage-lab
  labels:
    app: mock-db
spec:
  type: ClusterIP
  clusterIP: 10.96.100.100
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app: mock-db
---
# Mock Database Pod: ultra-lightweight TCP socket responder
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-db
  namespace: triage-lab
  labels:
    app: mock-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-db
  template:
    metadata:
      labels:
        app: mock-db
    spec:
      containers:
        - name: mock-postgres
          image: python:3.11-alpine
          command:
            - python3
            - -u
            - -c
            - |
              import socket
              s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
              s.bind(('0.0.0.0', 5432))
              s.listen(128)
              print("[MOCK-DB] PostgreSQL 16 Mock Engine listening on 0.0.0.0:5432")
              while True:
                  conn, addr = s.accept()
                  try:
                      data = conn.recv(64)
                      conn.sendall(b"OK: MOCK_POSTGRES_READY\n")
                  except Exception:
                      pass
                  finally:
                      conn.close()
          ports:
            - containerPort: 5432
              name: postgres
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
# RBAC for CoreDNS ConfigMap patcher job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coredns-patcher
  namespace: triage-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: coredns-patcher-role
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["coredns"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: coredns-patcher-binding
subjects:
  - kind: ServiceAccount
    name: coredns-patcher
    namespace: triage-lab
roleRef:
  kind: ClusterRole
  name: coredns-patcher-role
  apiGroup: rbac.authorization.k8s.io
---
# One-shot Job that configures CoreDNS hosts plugin for 'db.internal -> 10.96.100.100'
# Ensures 'db.internal' is NOT in cluster.local search domain, forcing glibc to walk all 5 search domains!
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-coredns-db-internal
  namespace: triage-lab
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: coredns-patcher
      restartPolicy: OnFailure
      containers:
        - name: patcher
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "[COREDNS-PATCH] Checking if db.internal is already configured..."
              CURRENT=$(kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}')
              if echo "$CURRENT" | grep -q "db.internal"; then
                echo "[COREDNS-PATCH] db.internal already present in Corefile. Skipping."
                exit 0
              fi

              echo "[COREDNS-PATCH] Appending hosts plugin entry for db.internal -> 10.96.100.100..."
              # Add hosts block before prometheus/forward in the Corefile
              UPDATED=$(echo "$CURRENT" | sed '/kubernetes cluster.local/a \        hosts {\n            10.96.100.100 db.internal\n            fallthrough\n        }')
              
              kubectl create configmap coredns -n kube-system --from-literal=Corefile="$UPDATED" --dry-run=client -o yaml | kubectl apply -f -
              echo "[COREDNS-PATCH] Restarting CoreDNS to reload Corefile..."
              kubectl rollout restart deployment coredns -n kube-system
              kubectl rollout status deployment coredns -n kube-system --timeout=60s
              echo "[COREDNS-PATCH] Successfully patched CoreDNS."
