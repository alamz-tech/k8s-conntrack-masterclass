# manifests/fixed/01-patched-client.yaml
# Production-grade patched client deployment.
# Key fixes:
#   1. dnsConfig with ndots:2 and single-request-reopen
#   2. Trailing dot on upstream hostname (db.internal.) to bypass cluster search domains
#   3. MODE=patched: Exponential backoff with Full Jitter and socket connection pooling
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-worker-code
  namespace: triage-lab
data:
  client.py: |
    #!/usr/bin/env python3
    """
    src/client.py
    Production-grade simulated Payment Processing Worker.

    Demonstrates:
      - Under 'broken' mode: Unjittered, high-concurrency socket connections to a non-FQDN
        hostname ('db.internal'), triggering parallel A/AAAA glibc DNS lookups across
        all Kubernetes search domains, rapidly exhausting netfilter conntrack.
      - Under 'patched' mode: Connection pooling, exponential backoff with Full Jitter,
        and FQDN trailing dot query paths ('db.internal.').
    """

    import argparse
    import logging
    import os
    import random
    import signal
    import socket
    import sys
    import threading
    import time
    from concurrent.futures import ThreadPoolExecutor
    from dataclasses import dataclass, field
    from typing import Optional

    # ANSI formatting
    RESET = "\033[0m"
    BOLD = "\033[1m"
    RED = "\033[0;31m"
    GREEN = "\033[0;32m"
    YELLOW = "\033[0;33m"
    CYAN = "\033[0;36m"
    MAGENTA = "\033[0;35m"

    logging.basicConfig(
        level=logging.INFO,
        format=f"%(asctime)s [{CYAN}%(threadName)s{RESET}] %(message)s",
        datefmt="%H:%M:%S",
    )
    logger = logging.getLogger("payment-worker")


    @dataclass
    class TelemetryStats:
        lock: threading.Lock = field(default_factory=threading.Lock)
        total_attempts: int = 0
        successful_connections: int = 0
        dns_failures: int = 0
        connect_failures: int = 0
        dns_latencies_ms: list = field(default_factory=list)
        start_time: float = field(default_factory=time.time)

        def record_attempt(self, success: bool, dns_time_ms: float, error_type: Optional[str] = None):
            with self.lock:
                self.total_attempts += 1
                if len(self.dns_latencies_ms) > 1000:
                    self.dns_latencies_ms = self.dns_latencies_ms[-500:]
                self.dns_latencies_ms.append(dns_time_ms)

                if success:
                    self.successful_connections += 1
                else:
                    if error_type == "DNS":
                        self.dns_failures += 1
                    else:
                        self.connect_failures += 1

        def snapshot(self):
            with self.lock:
                elapsed = max(0.001, time.time() - self.start_time)
                latencies = sorted(self.dns_latencies_ms)
                p50 = latencies[int(len(latencies) * 0.50)] if latencies else 0.0
                p95 = latencies[int(len(latencies) * 0.95)] if latencies else 0.0
                p99 = latencies[int(len(latencies) * 0.99)] if latencies else 0.0
                return {
                    "elapsed": elapsed,
                    "qps": self.total_attempts / elapsed,
                    "total": self.total_attempts,
                    "success": self.successful_connections,
                    "dns_fail": self.dns_failures,
                    "conn_fail": self.connect_failures,
                    "p50_ms": p50,
                    "p95_ms": p95,
                    "p99_ms": p99,
                }


    running = True


    def signal_handler(signum, frame):
        global running
        logger.info(f"{YELLOW}Signal {signum} received. Shutting down worker threads...{RESET}")
        running = False


    signal.signal(signal.SIGTERM, signal_handler)
    signal.signal(signal.SIGINT, signal_handler)


    def resolve_and_connect_broken(target_host: str, target_port: int, timeout: float, stats: TelemetryStats):
        """
        Simulates broken architecture:
          - Creates a new socket on EVERY iteration (zero pooling).
          - Forces glibc getaddrinfo() resolution every time.
          - Zero backoff, zero jitter on failure (immediate tight retry loop).
        """
        t_start = time.perf_counter()
        sock = None
        try:
            # Step 1: DNS Resolution (triggers glibc parallel A/AAAA walk over ndots:5 search paths)
            t_dns_start = time.perf_counter()
            addr_info = socket.getaddrinfo(target_host, target_port, socket.AF_UNSPEC, socket.SOCK_STREAM)
            dns_duration_ms = (time.perf_counter() - t_dns_start) * 1000

            # Step 2: Establish connection
            family, socktype, proto, canonname, sockaddr = addr_info[0]
            sock = socket.socket(family, socktype, proto)
            sock.settimeout(timeout)
            sock.connect(sockaddr)

            # Step 3: Fast mock payment heartbeat
            sock.sendall(b"PAYMENT_BATCH_SYNC\n")
            response = sock.recv(64)
            total_duration_ms = (time.perf_counter() - t_start) * 1000

            stats.record_attempt(success=True, dns_time_ms=dns_duration_ms)
            # In broken mode, keep tight loop pressure
            time.sleep(0.01)

        except socket.gaierror as e:
            dns_duration_ms = (time.perf_counter() - t_start) * 1000
            stats.record_attempt(success=False, dns_time_ms=dns_duration_ms, error_type="DNS")
            logger.warning(
                f"{RED}DNS RESOLUTION FAILURE{RESET} for '{target_host}': {e} "
                f"({dns_duration_ms:.1f}ms) -> {BOLD}Retrying immediately (zero-jitter storm){RESET}"
            )
            # Deliberate anti-pattern: NO SLEEP on failure! Retries immediately.
        except (socket.timeout, OSError) as e:
            dns_duration_ms = (time.perf_counter() - t_start) * 1000
            stats.record_attempt(success=False, dns_time_ms=dns_duration_ms, error_type="CONNECT")
            logger.warning(f"{YELLOW}SOCKET CONNECT FAILED{RESET} to {target_host}:{target_port} ({e})")
        finally:
            if sock:
                try:
                    sock.close()
                except Exception:
                    pass


    def resolve_and_connect_patched(
        target_host: str,
        target_port: int,
        timeout: float,
        stats: TelemetryStats,
        state: dict,
        base_backoff: float = 0.1,
        max_backoff: float = 2.0,
    ):
        """
        Simulates production-grade patched architecture:
          - Connection reuse / keepalive.
          - Exponential backoff with Full Jitter.
          - Trailing dot support for immediate FQDN evaluation.
        """
        sock = state.get("sock")
        if sock is None:
            attempt = state.get("fail_count", 0)
            t_dns_start = time.perf_counter()
            try:
                # Trailing dot check
                host_to_query = target_host if target_host.endswith(".") else f"{target_host}."
                addr_info = socket.getaddrinfo(host_to_query, target_port, socket.AF_UNSPEC, socket.SOCK_STREAM)
                dns_duration_ms = (time.perf_counter() - t_dns_start) * 1000

                family, socktype, proto, canonname, sockaddr = addr_info[0]
                sock = socket.socket(family, socktype, proto)
                sock.settimeout(timeout)
                sock.setsockopt(socket.SOL_SOCKET, socket.SO_KEEPALIVE, 1)
                sock.connect(sockaddr)

                state["sock"] = sock
                state["fail_count"] = 0
                stats.record_attempt(success=True, dns_time_ms=dns_duration_ms)
                logger.info(f"{GREEN}Connected (pooled){RESET} to {host_to_query} [DNS: {dns_duration_ms:.2f}ms]")

            except socket.gaierror as e:
                dns_duration_ms = (time.perf_counter() - t_dns_start) * 1000
                state["fail_count"] = attempt + 1
                stats.record_attempt(success=False, dns_time_ms=dns_duration_ms, error_type="DNS")

                # Exponential backoff with Full Jitter: sleep = random(0, min(max_backoff, base * 2^attempt))
                backoff_ceiling = min(max_backoff, base_backoff * (2 ** min(attempt, 6)))
                jittered_sleep = random.uniform(0.05, backoff_ceiling)
                logger.warning(
                    f"{YELLOW}Patched retry backoff{RESET} (attempt {attempt + 1}): "
                    f"sleeping {jittered_sleep:.2f}s after DNS error: {e}"
                )
                time.sleep(jittered_sleep)
                return
            except (socket.timeout, OSError) as e:
                state["fail_count"] = attempt + 1
                stats.record_attempt(success=False, dns_time_ms=0.0, error_type="CONNECT")
                time.sleep(random.uniform(0.1, 0.5))
                return

        # Connection established: send batch work
        try:
            sock.sendall(b"PING_TX\n")
            sock.recv(64)
            stats.record_attempt(success=True, dns_time_ms=0.0)
            time.sleep(0.05)  # Healthy processing cadence
        except Exception:
            # Broken pipe or closed connection: reset socket
            try:
                sock.close()
            except Exception:
                pass
            state["sock"] = None


    def worker_loop(thread_id: int, mode: str, target: str, port: int, timeout: float, stats: TelemetryStats):
        local_state = {"sock": None, "fail_count": 0}
        while running:
            if mode == "broken":
                resolve_and_connect_broken(target, port, timeout, stats)
            else:
                resolve_and_connect_patched(target, port, timeout, stats, local_state)


    def reporter_loop(stats: TelemetryStats, mode: str, target: str):
        while running:
            time.sleep(5.0)
            s = stats.snapshot()
            mode_badge = f"{RED}[BROKEN - STORM]{RESET}" if mode == "broken" else f"{GREEN}[PATCHED - POOLED]{RESET}"
            print(
                f"\n{BOLD}=== WORKER TELEMETRY {mode_badge} Target: {CYAN}{target}{RESET} ===\n"
                f"  Elapsed:       {s['elapsed']:.1f}s\n"
                f"  Throughput:    {BOLD}{s['qps']:.1f} queries/sec{RESET}\n"
                f"  Total Calls:   {s['total']} attempts\n"
                f"  Successful:    {GREEN}{s['success']}{RESET}\n"
                f"  DNS Failures:  {RED}{s['dns_fail']}{RESET}\n"
                f"  Socket Drops:  {YELLOW}{s['conn_fail']}{RESET}\n"
                f"  DNS Latency:   p50={s['p50_ms']:.1f}ms | p95={s['p95_ms']:.1f}ms | p99={s['p99_ms']:.1f}ms\n"
                f"=====================================================\n"
            )


    def main():
        parser = argparse.ArgumentParser(description="High-throughput Payment Worker Simulator")
        parser.add_argument("--mode", choices=["broken", "patched"], default=os.getenv("MODE", "broken"))
        parser.add_argument("--target", default=os.getenv("TARGET_HOST", "db.internal"))
        parser.add_argument("--port", type=int, default=int(os.getenv("TARGET_PORT", "5432")))
        parser.add_argument("--threads", type=int, default=int(os.getenv("CONCURRENCY", "20")))
        parser.add_argument("--timeout", type=float, default=float(os.getenv("REQUEST_TIMEOUT", "0.5")))
        args = parser.parse_args()

        print(f"\n{MAGENTA}{BOLD}===================================================={RESET}")
        print(f"{MAGENTA}{BOLD}  Payment Service Engine v2.4 (Simulated Workload)   {RESET}")
        print(f"{MAGENTA}{BOLD}===================================================={RESET}")
        print(f"  Execution Mode:    {BOLD}{args.mode.upper()}{RESET}")
        print(f"  Target Upstream:   {BOLD}{args.target}:{args.port}{RESET}")
        print(f"  Worker Threads:    {BOLD}{args.threads}{RESET}")
        print(f"  Socket Timeout:    {BOLD}{args.timeout}s{RESET}")
        print(f"  PID:               {os.getpid()}")
        print(f"====================================================\n")

        stats = TelemetryStats()

        # Start background reporter thread
        rep = threading.Thread(target=reporter_loop, args=(stats, args.mode, args.target), daemon=True)
        rep.start()

        # Launch worker thread pool
        with ThreadPoolExecutor(max_workers=args.threads, thread_name_prefix="PayWorker") as executor:
            for i in range(args.threads):
                executor.submit(worker_loop, i, args.mode, args.target, args.port, args.timeout, stats)


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  namespace: triage-lab
  labels:
    app: payment-worker
    tier: payment-processing
spec:
  replicas: 4
  selector:
    matchLabels:
      app: payment-worker
  template:
    metadata:
      labels:
        app: payment-worker
        tier: payment-processing
    spec:
      # Explicitly pin workloads to the target worker node
      nodeSelector:
        triage: "target"
      tolerations:
        - key: "node-role.kubernetes.io/worker"
          operator: "Exists"
          effect: "NoSchedule"

      # REMEDIATION 1: Explicit dnsConfig overriding ndots:5 down to ndots:2
      # and enabling single-request-reopen to prevent glibc A/AAAA socket collisions
      dnsPolicy: ClusterFirst
      dnsConfig:
        options:
          - name: ndots
            value: "2"
          - name: single-request-reopen
          - name: timeout
            value: "1"
          - name: attempts
            value: "2"

      containers:
        - name: worker
          image: python:3.11-slim
          command:
            - /bin/sh
            - -c
            - |
              python3 -m http.server 8080 --bind 127.0.0.1 &
              exec python3 -u /app/client.py
          env:
            # REMEDIATION 2: Switch to patched mode (connection pooling + Full Jitter backoff)
            - name: MODE
              value: "patched"
            # REMEDIATION 3: Trailing dot tells glibc this is an absolute FQDN, skipping all 4 search paths!
            - name: TARGET_HOST
              value: "db.internal."
            - name: TARGET_PORT
              value: "5432"
            - name: CONCURRENCY
              value: "25"
            - name: REQUEST_TIMEOUT
              value: "1.0"
          volumeMounts:
            - name: code
              mountPath: /app
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 1
      volumes:
        - name: code
          configMap:
            name: payment-worker-code
            defaultMode: 0755
